[project]
name = "lw"
version = "0.1.0"
description = "Is the Loudness War Over? Loudness and dynamic range of recorded music, 1980-2022."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=15",
    "orjson>=3.10",
    "zstandard>=0.22",
    "requests>=2.31",
    "numpy>=1.26",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "pyloudnorm>=0.1.1",
    "soundfile>=0.12",
    "tqdm>=4.66",
]

[project.optional-dependencies]
bayes = ["pymc>=5.10", "arviz>=0.17"]
dev = [
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "ipykernel>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lw"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: MCMC fits (~20 s)"]
